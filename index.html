              ontouchstart="handleTouchStart(event, ${item.id}, true, '${item.emoji}')"
              ontouchmove="handleTouchMove(event)"
              ontouchend="handleTouchEnd(event)">${item.emoji}</span>
      `).join('');
      el.closest('.source-group').classList.toggle('empty', items.length === 0);
    }
  }
}

function updateZoneDisplays(){
  // Group placed items by zone
  const byZone = {};
  placedItems.forEach(item => {
    if(!byZone[item.zone]) byZone[item.zone] = [];
    byZone[item.zone].push(item);
  });

  // Update each zone
  document.querySelectorAll('.drop-zone-items').forEach(el => {
    const zoneId = el.id.replace('zone-', '');
    const items = byZone[zoneId] || [];
    el.innerHTML = items.map(item => `
      <span class="placed-emoji ${selectedItemId === item.id && !selectedFromSource ? 'selected' : ''}"
            draggable="true" data-id="${item.id}" data-emoji="${item.emoji}"
            onmousedown="handleMouseDown()"
            onclick="tapPlacedItem(${item.id})"
            ondragstart="dragPlacedItem(event, ${item.id})"
            ontouchstart="handleTouchStart(event, ${item.id}, false, '${item.emoji}')"
            ontouchmove="handleTouchMove(event)"
            ontouchend="handleTouchEnd(event)">${item.emoji}</span>
    `).join('');
  });
}


function renderCounters(){
  const totalPlaced = placedItems.length;
  const totalSource = sourceItems.length;

  // Count by zone
  const byZone = {};
  placedItems.forEach(item => {
    if(!byZone[item.zone]) byZone[item.zone] = 0;
    byZone[item.zone]++;
  });

  let html = '';

  if(currentOp === 'suma'){
    const total = byZone['total'] || 0;
    html += `<div class="counter-chip" style="background:rgba(0,214,143,.15);border-color:var(--green)"><span style="color:var(--green)">🎯</span> ${L('Juntados:','Together:')} ${total}</div>`;
    if(totalSource > 0) html += `<div class="counter-chip"><span style="color:var(--text-dim)">📦</span> ${L('Por juntar:','To combine:')} ${totalSource}</div>`;
  } else if(currentOp === 'resta'){
    const keep = byZone['keep'] || 0;
    const remove = byZone['remove'] || 0;
    if(keep > 0) html += `<div class="counter-chip" style="background:rgba(0,214,143,.15);border-color:var(--green)"><span style="color:var(--green)">✅</span> ${L('Quedan:','Stay:')} ${keep}</div>`;
    if(remove > 0) html += `<div class="counter-chip" style="background:rgba(255,159,67,.15);border-color:var(--orange)"><span style="color:var(--orange)">📤</span> ${L('Se van:','Go away:')} ${remove}</div>`;
    if(totalSource > 0) html += `<div class="counter-chip"><span style="color:var(--text-dim)">🎒</span> ${L('Sin separar:','Unsorted:')} ${totalSource}</div>`;
  } else if(currentOp === 'multi'){
    for(let i = 0; i < numA; i++){
      const count = byZone['g' + i] || 0;
      if(count > 0) html += `<div class="counter-chip"><span style="font-size:1rem">${currentGroupEmoji}</span>${i+1}: ${count}/${numB}</div>`;
    }
    if(totalSource > 0) html += `<div class="counter-chip"><span style="color:var(--text-dim)">📦</span> ${L('Por colocar:','To place:')} ${totalSource}</div>`;
  } else if(currentOp === 'divi'){
    for(let i = 0; i < numB; i++){
      const count = byZone['g' + i] || 0;
      if(count > 0) html += `<div class="counter-chip"><span style="font-size:1rem">${currentGroupEmoji}</span>${i+1}: ${count}</div>`;
    }
    if(totalSource > 0) html += `<div class="counter-chip"><span style="color:var(--text-dim)">🎁</span> ${L('Por repartir:','To share:')} ${totalSource}</div>`;
  }

  if(totalPlaced > 0) html += `<div class="counter-chip" style="background:rgba(255,212,59,.15);border-color:var(--yellow)"><span style="color:var(--yellow)">⭐</span> ${L('Colocados:','Placed:')} ${totalPlaced}</div>`;

  document.getElementById('counters').innerHTML = html;
}

function renderActions(){
  document.getElementById('actions').innerHTML = '';
}

function renderResult(data){
  let attemptsHTML = '';
  if(attempts > 0 && !hasChecked){
    attemptsHTML = '<div class="attempts-indicator">';
    for(let i = 0; i < 3; i++){
      attemptsHTML += `<div class="attempt-dot ${i < attempts ? 'used' : ''}"></div>`;
    }
    attemptsHTML += '</div>';
  }

  let encouragementHTML = '';
  if(data.type === 'wrong' && attempts >= 2){
    encouragementHTML = `<div class="encouragement">${getEncouragements()[Math.floor(Math.random() * getEncouragements().length)]}</div>`;
  }

  document.getElementById('resultCard').innerHTML = `
    <h3>📋 Resultado</h3>
    <div class="feedback ${data.type}">
      <span class="big-emoji">${data.emoji}</span>
      ${data.text}
      ${data.detail ? `<div class="detail">${data.detail}</div>` : ''}
    </div>
    ${attemptsHTML}
    ${encouragementHTML}
  `;
}

// ========== INTERACTION ==========
let draggedItemId = null;
let draggedFromSource = false;
let selectedItemId = null;
let selectedFromSource = false;

// Touch drag state
let touchDragId = null;
let touchDragFromSource = false;
let touchDragEmoji = '';
let ghostEl = null;

// Detectar si es móvil
const isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// ===== TOUCH DRAG & DROP =====
function handleTouchStart(e, id, fromSource, emoji){
  e.preventDefault();
  const touch = e.touches[0];

  touchDragId = id;
  touchDragFromSource = fromSource;
  touchDragEmoji = emoji;

  // Crear elemento fantasma
  ghostEl = document.createElement('div');
  ghostEl.className = 'drag-ghost';
  ghostEl.textContent = emoji;
  ghostEl.style.left = touch.clientX + 'px';
  ghostEl.style.top = touch.clientY + 'px';
  document.body.appendChild(ghostEl);

  e.target.style.opacity = '0.3';
  sndClick();
}

function handleTouchMove(e){
  if(!ghostEl) return;
  e.preventDefault();
  const touch = e.touches[0];
  ghostEl.style.left = touch.clientX + 'px';
  ghostEl.style.top = touch.clientY + 'px';

  // Highlight zona debajo del dedo
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('highlight'));
  const trashBin = document.getElementById('trashBin');
  if(trashBin) trashBin.classList.remove('drag-over');

  if(el){
    const zone = el.closest('.drop-zone');
    if(zone) zone.classList.add('highlight');
    if(el.closest('.trash-bin')) trashBin.classList.add('drag-over');
  }
}

function handleTouchEnd(e){
  if(!ghostEl || touchDragId === null) return;

  const touch = e.changedTouches[0];
  const el = document.elementFromPoint(touch.clientX, touch.clientY);

  // Limpiar ghost
  ghostEl.remove();
  ghostEl = null;

  // Restaurar opacidad
  document.querySelectorAll('.source-emoji, .placed-emoji').forEach(x => x.style.opacity = '1');
  document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('highlight'));
  const trashBin = document.getElementById('trashBin');
  if(trashBin) trashBin.classList.remove('drag-over');

  if(el){
    // Verificar si soltó en una zona
    const zone = el.closest('.drop-zone');
    if(zone){
      const zoneId = zone.querySelector('.drop-zone-items')?.id?.replace('zone-','');
      if(zoneId !== undefined){
        dropItemToZone(zoneId);
        return;
      }
    }

    // Verificar si soltó en la basura
    if(el.closest('.trash-bin')){
      dropItemToTrash();
      return;
    }
  }

  // No soltó en ningún lugar válido
  touchDragId = null;
  touchDragFromSource = false;
}

function dropItemToZone(zone){
  if(touchDragId === null) return;

  if(touchDragFromSource){
    const itemIndex = sourceItems.findIndex(i => i.id === touchDragId);
    if(itemIndex >= 0){
      const item = sourceItems.splice(itemIndex, 1)[0];
      placedItems.push({id: item.id, emoji: item.emoji, zone: zone});
      sndDrop();
    }
  } else {
    const item = placedItems.find(i => i.id === touchDragId);
    if(item){
      item.zone = zone;
      sndPlace();
    }
  }

  touchDragId = null;
  touchDragFromSource = false;
  updateAllDisplays();
  renderCounters();
}

function dropItemToTrash(){
  if(touchDragId === null || touchDragFromSource) return;

  const itemIndex = placedItems.findIndex(i => i.id === touchDragId);
  if(itemIndex >= 0){
    const item = placedItems.splice(itemIndex, 1)[0];
    let group = 'main';
    if(currentOp === 'suma'){
      group = item.emoji === currentEmoji ? 'A' : 'B';
    }
    sourceItems.push({id: item.id, emoji: item.emoji, group: group});
    sndTrash();
  }

  touchDragId = null;
  touchDragFromSource = false;
  updateAllDisplays();
  renderCounters();
}

// Prevenir scroll mientras se arrastra
document.addEventListener('touchmove', (e) => {
  if(ghostEl) e.preventDefault();
}, {passive: false});

// ===== DESKTOP DRAG =====
let currentDragImg = null;

function dragSourceItem(e, id){
  e.stopPropagation();
  isDragging = true;
  draggedItemId = id;
  draggedFromSource = true;
  e.target.classList.add('dragging');

  e.dataTransfer.setData('text/plain', 'source-' + id);
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.dropEffect = 'move';

  // Crear imagen de drag personalizada (se limpia en dragend)
  if(currentDragImg) currentDragImg.remove();
  const dragImg = e.target.cloneNode(true);
  dragImg.style.position = 'absolute';
  dragImg.style.top = '-1000px';
  dragImg.style.left = '-1000px';
  dragImg.style.fontSize = '2.5rem';
  document.body.appendChild(dragImg);
  e.dataTransfer.setDragImage(dragImg, 25, 25);
  currentDragImg = dragImg;

  sndClick();
}

function dragPlacedItem(e, id){
  e.stopPropagation();
  isDragging = true;
  draggedItemId = id;
  draggedFromSource = false;
  e.target.classList.add('dragging');

  e.dataTransfer.setData('text/plain', 'placed-' + id);
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.dropEffect = 'move';

  // Crear imagen de drag personalizada (se limpia en dragend)
  if(currentDragImg) currentDragImg.remove();
  const dragImg = e.target.cloneNode(true);
  dragImg.style.position = 'absolute';
  dragImg.style.top = '-1000px';
  dragImg.style.left = '-1000px';
  dragImg.style.fontSize = '2.5rem';
  document.body.appendChild(dragImg);
  e.dataTransfer.setDragImage(dragImg, 25, 25);
  currentDragImg = dragImg;

  sndClick();
}

// TAP como fallback (doble propósito) - solo si no se inició drag
let mouseDownTime = 0;
let isDragging = false;

function tapSourceItem(id, emoji){
  // Si el mouse estuvo presionado más de 150ms, fue un drag, no click
  if(isDragging || (Date.now() - mouseDownTime > 150 && mouseDownTime > 0)) {
    isDragging = false;
    return;
  }
  if(selectedItemId === id && selectedFromSource){
    selectedItemId = null;
    selectedFromSource = false;
  } else {
    selectedItemId = id;
    selectedFromSource = true;
    sndClick();
  }
  updateAllDisplays();
}

function tapPlacedItem(id){
  // Si el mouse estuvo presionado más de 150ms, fue un drag, no click
  if(isDragging || (Date.now() - mouseDownTime > 150 && mouseDownTime > 0)) {
    isDragging = false;
    return;
  }
  if(selectedItemId === id && !selectedFromSource){
    selectedItemId = null;
    selectedFromSource = false;
  } else {
    selectedItemId = id;
    selectedFromSource = false;
    sndClick();
  }
  updateAllDisplays();
}

// Detectar inicio de posible drag
function handleMouseDown(){
  mouseDownTime = Date.now();
  isDragging = false;
}

function tapZone(zone){
  if(selectedItemId === null) return;

  if(selectedFromSource){
    const itemIndex = sourceItems.findIndex(i => i.id === selectedItemId);
    if(itemIndex >= 0){
      const item = sourceItems.splice(itemIndex, 1)[0];
      placedItems.push({id: item.id, emoji: item.emoji, zone: zone});
      sndDrop();
    }
  } else {
    const item = placedItems.find(i => i.id === selectedItemId);
    if(item){
      item.zone = zone;
      sndPlace();
    }
  }

  selectedItemId = null;
  selectedFromSource = false;
  updateAllDisplays();
  renderCounters();
}

function tapTrash(){
  if(selectedItemId === null) return;

  if(!selectedFromSource){
    const itemIndex = placedItems.findIndex(i => i.id === selectedItemId);
    if(itemIndex >= 0){
      const item = placedItems.splice(itemIndex, 1)[0];
      let group = 'main';
      if(currentOp === 'suma'){
        group = item.emoji === currentEmoji ? 'A' : 'B';
      }
      sourceItems.push({id: item.id, emoji: item.emoji, group: group});
      sndTrash();
    }
  }

  selectedItemId = null;
  selectedFromSource = false;
  updateAllDisplays();
  renderCounters();
}

function allowDrop(e){
  e.preventDefault();
  e.stopPropagation();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('highlight');
}

function handleDragEnter(e){
  e.preventDefault();
  if(e.currentTarget && e.currentTarget.classList){
    e.currentTarget.classList.add('highlight');
    sndZoneHighlight();
  }
}

function handleDragLeave(e){
  e.preventDefault();
  if(!e.currentTarget || !e.currentTarget.classList) return;
  // Solo quitar highlight si realmente salió del elemento
  const rect = e.currentTarget.getBoundingClientRect();
  const x = e.clientX;
  const y = e.clientY;
  if(x < rect.left || x > rect.right || y < rect.top || y > rect.bottom){
    e.currentTarget.classList.remove('highlight');
  }
}

function dropToZone(e, zone){
  e.preventDefault();
  e.stopPropagation();
  e.currentTarget.classList.remove('highlight');

  if(draggedItemId === null) return;

  if(draggedFromSource){
    const itemIndex = sourceItems.findIndex(i => i.id === draggedItemId);
    if(itemIndex >= 0){
      const item = sourceItems.splice(itemIndex, 1)[0];
      placedItems.push({id: item.id, emoji: item.emoji, zone: zone});
      sndDrop();
    }
  } else {
    const item = placedItems.find(i => i.id === draggedItemId);
    if(item){
      item.zone = zone;
      sndPlace();
    }
  }

  draggedItemId = null;
  draggedFromSource = false;
  updateAllDisplays();
  renderCounters();

  // Guardar referencia al elemento antes del timeout
  const targetEl = e.currentTarget;
  if(targetEl && targetEl.classList){
    targetEl.classList.add('pulse');
    setTimeout(() => {
      if(targetEl && targetEl.classList) targetEl.classList.remove('pulse');
    }, 500);
  }
}

// Trash bin functions
function trashDragOver(e){
  e.preventDefault();
  if(e.currentTarget && e.currentTarget.classList){
    e.currentTarget.classList.add('drag-over');
  }
}

function trashDragLeave(e){
  if(e.currentTarget && e.currentTarget.classList){
    e.currentTarget.classList.remove('drag-over');
  }
}

function trashDrop(e){
  e.preventDefault();
  if(e.currentTarget && e.currentTarget.classList){
    e.currentTarget.classList.remove('drag-over');
  }

  if(draggedItemId === null) return;

  if(!draggedFromSource){
    const itemIndex = placedItems.findIndex(i => i.id === draggedItemId);
    if(itemIndex >= 0){
      const item = placedItems.splice(itemIndex, 1)[0];
      let group = 'main';
      if(currentOp === 'suma'){
        group = item.emoji === currentEmoji ? 'A' : 'B';
      }
      sourceItems.push({id: item.id, emoji: item.emoji, group: group});
      sndTrash();
    }
  }

  draggedItemId = null;
  draggedFromSource = false;
  updateAllDisplays();
  renderCounters();
}

// Remove highlight when drag leaves
document.addEventListener('dragleave', (e) => {
  if(e.target.classList && e.target.classList.contains('drop-zone')){
    e.target.classList.remove('highlight');
  }
});

// Permitir drag en toda la página para evitar icono de prohibido
document.addEventListener('dragover', (e) => {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
});

document.addEventListener('dragend', () => {
  document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('highlight'));
  document.querySelectorAll('.source-emoji, .placed-emoji').forEach(e => e.classList.remove('dragging'));
  const trash = document.getElementById('trashBin');
  if(trash) trash.classList.remove('drag-over');
  if(currentDragImg){ currentDragImg.remove(); currentDragImg = null; }
  draggedItemId = null;
  draggedFromSource = false;
});

// ========== CHECK ==========
function checkAnswer(){
  if(hasChecked) return;
  sndButtonPress();

  const totalPlaced = placedItems.length;
  const totalSource = sourceItems.length;

  // Count by zone
  const byZone = {};
  placedItems.forEach(item => {
    if(!byZone[item.zone]) byZone[item.zone] = 0;
    byZone[item.zone]++;
  });

  let correct = false;
  let explanation = '';

  if(totalPlaced === 0){
    sndWrong();
    renderResult({type:'wrong', emoji:'🤔', text:L('¡Arrastra los objetos!','Drag the objects!'), detail:L(`Mueve los ${currentEmoji} desde arriba`,`Move the ${currentEmoji} from above`)});
    return;
  }

  attempts++;

  if(currentOp === 'suma'){
    // Para suma: todos los items deben estar en la zona 'total'
    const total = byZone['total'] || 0;
    if(total === answer && totalSource === 0) {
      correct = true;
    } else {
      if(totalSource > 0) {
        explanation = L('¡Aún te faltan objetos por juntar! Arrastra todos al centro.','You still have objects to put together! Drag them all to the center.');
      } else if(total > answer) {
        explanation = L(`Pusiste demasiados ${currentEmoji}. Recuerda: ${numA} + ${numB}. ¡Cuenta de nuevo con los dedos!`,`Too many ${currentEmoji}. Remember: ${numA} + ${numB}. Count again with your fingers!`);
      } else if(total < answer) {
        explanation = L(`Te faltan ${currentEmoji}. Piensa: ${numA} + ${numB}. ¡Cuenta de nuevo despacio!`,`You need more ${currentEmoji}. Think: ${numA} + ${numB}. Count again slowly!`);
      }
    }
  }
  else if(currentOp === 'resta'){
    const keep = byZone['keep'] || 0;
    const remove = byZone['remove'] || 0;

    if(keep === answer && remove === numB && totalSource === 0){
      correct = true;
    } else {
      if(totalSource > 0) {
        explanation = L(`¡Aún quedan ${totalSource} ${currentEmoji} sin separar! Decide: ¿se quedan o se van?`,`There are still ${totalSource} ${currentEmoji} not separated! Decide: do they stay or go?`);
      } else if(keep === 0 || remove === 0) {
        explanation = L(`Debes poner ${currentEmoji} en AMBAS zonas: los que quedan Y los que se van.`,`You need to put ${currentEmoji} in BOTH zones: those that stay AND those that go.`);
      } else if(remove !== numB) {
        explanation = L(`Recuerda que se van ${numB} ${currentEmoji}. Pon esa cantidad en "Se van" y lo que sobra en "Quedan". ¡Piénsalo!`,`Remember ${numB} ${currentEmoji} go away. Put that amount in "Go away" and the rest in "Stay". Think about it!`);
      } else if(keep !== answer) {
        explanation = L(`Si tenías ${numA} y se van ${numB}... ¿cuántos quedan? Cuenta con los dedos: ${numA} menos ${numB}.`,`If you had ${numA} and ${numB} go away... how many are left? Count with your fingers: ${numA} minus ${numB}.`);
      }
    }
  }
  else if(currentOp === 'multi'){
    // Multiplicación: numA grupos, cada uno con numB items
    const groupCounts = [];
    for(let i = 0; i < numA; i++){
      groupCounts.push(byZone['g' + i] || 0);
    }
    const allCorrect = groupCounts.every(c => c === numB);
    const usedGroups = groupCounts.filter(c => c > 0).length;

    if(totalPlaced === answer && totalSource === 0 && usedGroups === numA && allCorrect){
      correct = true;
    } else {
      if(totalSource > 0) {
        explanation = L(`¡Aún quedan ${totalSource} ${currentEmoji} por organizar! Ponlos en los ${currentGroupEmoji}.`,`There are still ${totalSource} ${currentEmoji} to organize! Put them in the ${currentGroupEmoji}.`);
      } else if(usedGroups < numA) {
        explanation = L(`Debes llenar TODOS los ${numA} ${currentGroupEmoji}. Hay ${numA - usedGroups} vacíos. ¡Cada uno necesita la misma cantidad!`,`You must fill ALL ${numA} ${currentGroupEmoji}. There are ${numA - usedGroups} empty. Each one needs the same amount!`);
      } else if(!allCorrect) {
        const ejemplo = groupCounts.map((c, i) => `${currentGroupEmoji}${i+1}: ${c}`).join(', ');
        explanation = L(`Los grupos no están iguales: ${ejemplo}. Recuerda que CADA ${currentGroupEmoji} debe tener la misma cantidad. ¡Reorganiza!`,`The groups are not equal: ${ejemplo}. Remember EACH ${currentGroupEmoji} must have the same amount. Reorganize!`);
      }
    }
  }
  else if(currentOp === 'divi'){
    // División: numA cosas ÷ numB grupos = answer por grupo
    const zoneCounts = [];
    for(let i = 0; i < numB; i++){
      zoneCounts.push(byZone['g' + i] || 0);
    }
    const allEqual = zoneCounts.every(c => c === answer);
    const usedZones = zoneCounts.filter(c => c > 0).length;

    if(totalPlaced === numA && totalSource === 0 && usedZones === numB && allEqual){
      correct = true;
    } else {
      // Explicación sin dar la respuesta exacta
      const zoneCountsList = zoneCounts.filter(c => c > 0);
      const hasUnequalGroups = zoneCountsList.length > 1 && !zoneCountsList.every(c => c === zoneCountsList[0]);

      if(totalSource > 0) {
        explanation = L(`<b>¡Faltan!</b> Aún tienes ${totalSource} ${currentEmoji} arriba. <br>Dividir es <em>repartir TODO</em>. Debes repartir los ${numA} ${currentEmoji} entre los ${numB} ${currentGroupEmoji}. ¡No puede quedar ninguno arriba!`,`<b>Missing!</b> You still have ${totalSource} ${currentEmoji} above. <br>Dividing means <em>sharing ALL</em>. You must share all ${numA} ${currentEmoji} among the ${numB} ${currentGroupEmoji}. None can be left above!`);
      } else if(usedZones !== numB) {
        const emptyZones = numB - usedZones;
        explanation = L(`<b>¡Hay ${currentGroupEmoji} vacíos!</b> Tienes ${numB} ${currentGroupEmoji} y ${emptyZones} no tienen nada.<br>Dividir es repartir entre TODOS. ¡Ningún ${currentGroupEmoji} puede quedar vacío!`,`<b>There are empty ${currentGroupEmoji}!</b> You have ${numB} ${currentGroupEmoji} and ${emptyZones} have nothing.<br>Dividing means sharing among ALL. No ${currentGroupEmoji} can be empty!`);
      } else if(hasUnequalGroups) {
        const countsText = zoneCounts.map((c, i) => `${currentGroupEmoji}${i+1}: ${c}`).join(', ');
        explanation = L(`<b>¡No están iguales!</b> Tienes: ${countsText}.<br>Dividir es repartir <em>en partes IGUALES</em>. Todos los ${currentGroupEmoji} deben tener la misma cantidad. ¡Mueve algunos!`,`<b>They're not equal!</b> You have: ${countsText}.<br>Dividing means sharing in <em>EQUAL parts</em>. All ${currentGroupEmoji} must have the same amount. Move some!`);
      } else if(!allEqual) {

      );

let currentScale = null;

function getRandomScale(){
  return MUSICAL_SCALES[Math.floor(Math.random() * MUSICAL_SCALES.length)];
}

function glowAllFilled(isCorrect){
  const emojis = document.querySelectorAll('.placed-emoji');

  if(isCorrect){
    // Elegir una escala aleatoria para esta celebración
    currentScale = getRandomScale();
    const scale = currentScale.notes;
    const delayPerItem = 350; // 350ms entre cada objeto

    emojis.forEach((el, i) => {
      setTimeout(() => {
        // Nota musical ascendente (cicla si hay más objetos que notas)
        const noteIndex = i % scale.length;
        const freq = scale[noteIndex];

        // Tocar nota musical con duración más larga
        playCountNote(freq, 0.25);

        // Efecto visual de "contado"
        el.classList.add('counting');
        el.style.transform = 'scale(1.4)';
        el.style.filter = 'drop-shadow(0 0 15px var(--yellow))';
        el.style.transition = 'all 0.3s ease';

        // Mostrar número de conteo
        showCountNumber(el, i + 1);

        // Volver a estado normal después
        setTimeout(() => {
          el.style.transform = 'scale(1.1)';
          el.style.filter = 'drop-shadow(0 0 8px var(--green))';
        }, 250);

      }, i * delayPerItem);
    });

    // Acorde final después de contar todos
    const totalTime = emojis.length * delayPerItem + 300;
    setTimeout(() => {
      playFinalChord(currentScale.chord);
      // Efecto de brillo final en todos
      emojis.forEach(el => {
        el.classList.add('glow');
        el.classList.add('bounce');
      });
    }, totalTime);

    // Efecto en las zonas después del conteo
    setTimeout(() => {
      document.querySelectorAll('.drop-zone').forEach((zone, i) => {
        setTimeout(() => {
          zone.classList.add('success');
          setTimeout(() => zone.classList.remove('success'), 600);
        }, i * 100);
      });
    }, totalTime + 200);

    // Sonido de cierre épico - el gran final
    setTimeout(() => {
      playClosingFanfare(currentScale);
    }, totalTime + 500);

  } else {
    // Incorrecto - shake rápido
    emojis.forEach((el, i) => {
      setTimeout(() => {
        el.classList.add('shake');
      }, i * 50);
    });
  }
}

// Nota musical para el conteo
function playCountNote(freq, dur){
  if(!soundOn) return;
  ensureAudio();
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = 'sine';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.15, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + dur);
  o.connect(g).connect(actx.destination);
  o.start();
  o.stop(actx.currentTime + dur);

  // Añadir armónico para sonido más rico
  const o2 = actx.createOscillator();
  const g2 = actx.createGain();
  o2.type = 'triangle';
  o2.frequency.value = freq * 2;
  g2.gain.setValueAtTime(0.05, actx.currentTime);
  g2.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur * 0.8);
  o2.connect(g2).connect(actx.destination);
  o2.start();
  o2.stop(actx.currentTime + dur);
}

// Acorde final que usa la escala actual
function playFinalChord(chordNotes){
  if(!soundOn) return;
  ensureAudio();
  // Usar el acorde pasado o un acorde mayor por defecto
  const notes = chordNotes || [523, 659, 784, 1047];
  notes.forEach((freq, i) => {
    setTimeout(() => {
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.1, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.6);
      o.connect(g).connect(actx.destination);
      o.start();
      o.stop(actx.currentTime + 0.6);

      // Añadir armónico para más riqueza
      const o2 = actx.createOscillator();
      const g2 = actx.createGain();
      o2.type = 'triangle';
      o2.frequency.value = freq * 0.5; // Octava abajo
      g2.gain.setValueAtTime(0.04, actx.currentTime);
      g2.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.5);
      o2.connect(g2).connect(actx.destination);
      o2.start();
      o2.stop(actx.currentTime + 0.5);
    }, i * 40);
  });
}

// Fanfarria de cierre épica - el gran final con estrellas
function playClosingFanfare(scale){
  if(!soundOn) return;
  ensureAudio();

  // Diferentes finales épicos
  const finales = [
    // Final tipo "ta-da!" clásico
    () => {
      const baseFreq = scale ? scale.chord[0] : 523;
      // Redoble ascendente rápido
      [0, 2, 4, 5, 7].forEach((semitone, i) => {
        const freq = baseFreq * Math.pow(2, semitone/12);
        setTimeout(() => playTone(freq, 0.08, 'triangle', 0.08), i * 40);
      });
      // Acorde final sostenido con brillo
      setTimeout(() => {
        const finalChord = scale ? scale.chord : [523, 659, 784, 1047];
        finalChord.forEach((f, i) => {
          setTimeout(() => {
            // Nota principal
            playTone(f, 0.8, 'sine', 0.12);
            // Octava arriba brillante
            playTone(f * 2, 0.6, 'sine', 0.05);
            // Shimmer
            playTone(f * 1.5, 0.5, 'triangle', 0.03);
          }, i * 25);
        });
      }, 220);
      // Destello final agudo
      setTimeout(() => {
        playTone(2093, 0.4, 'sine', 0.06); // Do muy alto
        playTone(2637, 0.35, 'sine', 0.04); // Mi muy alto
      }, 500);
    },

    // Final tipo "cascada de estrellas"
    () => {
      const baseNotes = scale ? scale.notes.slice(-6) : [523, 587, 659, 784, 880, 1047];
      // Cascada descendente brillante
      baseNotes.reverse().forEach((f, i) => {
        setTimeout(() => {
          playTone(f * 2, 0.15, 'sine', 0.07);
          playTone(f, 0.2, 'triangle', 0.05);
        }, i * 60);
      });
      // Acorde final con reverb simulado
      setTimeout(() => {
        const chord = scale ? scale.chord : [523, 659, 784, 1047];
        chord.forEach(f => {
          playTone(f, 1.0, 'sine', 0.1);
          setTimeout(() => playTone(f, 0.8, 'sine', 0.05), 50);
          setTimeout(() => playTone(f, 0.6, 'triangle', 0.03), 100);
        });
        // Brillo final
        setTimeout(() => playTone(1568, 0.5, 'sine', 0.06), 200);
        setTimeout(() => playTone(2093, 0.4, 'sine', 0.04), 300);
      }, 380);
    },

    // Final tipo "campanas mágicas"
    () => {
      const bellNotes = [1047, 1318, 1568, 2093, 1568, 1318, 1047];
      bellNotes.forEach((f, i) => {
        setTimeout(() => {
          playTone(f, 0.3, 'sine', 0.08);
          playTone(f * 0.5, 0.4, 'triangle', 0.04); // Sub-octava
        }, i * 70);
      });
      // Acorde majestuoso final
      setTimeout(() => {
        const chord = scale ? scale.chord : [523, 659, 784, 1047];
        // Construir el acorde gradualmente
        chord.forEach((f, i) => {
          setTimeout(() => {
            playTone(f, 1.2, 'sine', 0.1);
            playTone(f * 2, 0.8, 'sine', 0.04);
          }, i * 60);
        });
      }, 520);
      // Destello de cierre
      setTimeout(() => {
        [1568, 2093, 2637].forEach((f, i) => {

// ========== SÍNTESIS DE VOZ (TEXT-TO-SPEECH) ==========
let speechSynth = window.speechSynthesis;
let currentUtterance = null;
let isSpeaking = false;
let voiceReady = false;
let selectedVoice = null;

// Buscar la mejor voz según el idioma actual (LANG)
function findBestVoice(){
  const voices = speechSynth.getVoices();
  const langPrefix = LANG === 'en' ? 'en' : 'es';
  console.log('Buscando voz para:', langPrefix, '- Voces disponibles:', voices.length);

  // Prioridad 1: Voces de red/online
  const onlineVoice = voices.find(v =>
    v.lang.startsWith(langPrefix) && v.localService === false
  );
  if(onlineVoice){
    selectedVoice = onlineVoice;
    console.log('Voz online encontrada:', onlineVoice.name);
    voiceReady = true;
    return;
  }

  // Prioridad 2: Voces premium según idioma
  const premiumVoicesES = [
    'Microsoft Dalia Online', 'Microsoft Jorge Online',
    'Microsoft Sabina', 'Microsoft Helena', 'Microsoft Laura', 'Microsoft Raul',
    'Google español', 'Google español de Estados Unidos', 'Google español de México',
    'Paulina', 'Monica', 'Juan', 'Diego', 'Angelica', 'Jimena'
  ];
  const premiumVoicesEN = [
    'Microsoft Zira Online', 'Microsoft David Online', 'Microsoft Mark Online',
    'Microsoft Jenny Online', 'Microsoft Aria Online',
    'Microsoft Zira', 'Microsoft David', 'Microsoft Mark',
    'Google US English', 'Google UK English Female', 'Google UK English Male',
    'Samantha', 'Alex', 'Daniel', 'Karen', 'Moira', 'Tessa'
  ];
  const premiumVoices = LANG === 'en' ? premiumVoicesEN : premiumVoicesES;

  for(const premiumName of premiumVoices){
    const found = voices.find(v => v.name.includes(premiumName) && v.lang.startsWith(langPrefix));
    if(found){
      selectedVoice = found;
      console.log('Voz premium encontrada:', found.name);
      voiceReady = true;
      return;
    }
  }

  // Prioridad 3: Cualquier voz natural del idioma
  const naturalVoice = voices.find(v =>
    v.lang.startsWith(langPrefix) &&
    !v.name.toLowerCase().includes('espeak') &&
    (v.name.includes('Microsoft') || v.name.includes('Google') || v.localService === false)
  );
  if(naturalVoice){
    selectedVoice = naturalVoice;
    console.log('Voz natural encontrada:', naturalVoice.name);
    voiceReady = true;
    return;
  }

  // Prioridad 4: Cualquier voz del idioma
  if(LANG === 'en'){
    selectedVoice = voices.find(v => v.lang === 'en-US') ||
                    voices.find(v => v.lang === 'en-GB') ||
                    voices.find(v => v.lang.startsWith('en'));
  } else {
    selectedVoice = voices.find(v => v.lang === 'es-MX') ||
                    voices.find(v => v.lang === 'es-419') ||
                    voices.find(v => v.lang === 'es-US') ||
                    voices.find(v => v.lang === 'es-ES') ||
                    voices.find(v => v.lang.startsWith('es'));
  }

  // Fallback absoluto
  if(!selectedVoice && voices.length > 0){
    console.warn('No se encontró voz para', langPrefix, '- usando fallback:', voices[0].name);
    selectedVoice = voices[0];
  }

  console.log('Voz seleccionada:', selectedVoice?.name || 'ninguna', selectedVoice?.lang || '');
  voiceReady = true;
}

// Cargar voces (pueden cargarse de forma asíncrona)
if(speechSynth.onvoiceschanged !== undefined){
  speechSynth.onvoiceschanged = findBestVoice;
}
findBestVoice();

// Función principal para hablar texto
function speakText(text, onEnd = null, options = {}){
  try {
    if(!speechSynth) {
      console.log('Speech synthesis no disponible');
      if(onEnd) onEnd();
      return;
    }

    // Cancelar cualquier habla anterior
    stopSpeaking();

    // Bug fix para Chrome: necesita un "resume" si está pausado
    speechSynth.cancel();

    // Recargar voces si no están listas
    if(!selectedVoice || speechSynth.getVoices().length === 0){
      findSpanishVoice();
    }

    // Limpiar HTML del texto y agregar pausas naturales
    let cleanText = text.replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();

    // Normalizar Unicode NFC para que acentos como ó no se lean como "o acento agudo"
    if(cleanText.normalize) cleanText = cleanText.normalize('NFC');

    // Limpiar emojis que la voz podría intentar describir
    cleanText = cleanText.replace(/[\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{FE00}-\u{FE0F}\u{1F000}-\u{1FFFF}]/gu, '');

  // Agregar pausas más largas después de puntos y signos de exclamación/interrogación
  // Usamos comas extras que la voz interpreta como pausas
  // Agregar pausas sutiles entre oraciones (no tan largas)
  cleanText = cleanText
    .replace(/\. /g, '. . ')      // Pausa corta después de punto
    .replace(/! /g, '! . ')       // Pausa después de exclamación
    .replace(/\? /g, '? . ');     // Pausa después de interrogación

  console.log('Intentando hablar:', cleanText.substring(0, 50) + '...');

  currentUtterance = new SpeechSynthesisUtterance(cleanText);

  // Configurar voz - intentar de nuevo buscar si no hay
  if(!selectedVoice){
    const voices = speechSynth.getVoices();
    const lp = LANG === 'en' ? 'en' : 'es';
    selectedVoice = voices.find(v => v.lang.startsWith(lp)) || voices[0];
  }

  if(selectedVoice) {
    currentUtterance.voice = selectedVoice;
    console.log('Usando voz:', selectedVoice.name, selectedVoice.lang);
  }

  currentUtterance.lang = selectedVoice?.lang || (LANG === 'en' ? 'en-US' : 'es-MX');

  // Velocidad intermedia - 0.88 es pausado pero no lento
  currentUtterance.rate = options.rate || 0.88;
  currentUtterance.pitch = options.pitch || 1.0;
  currentUtterance.volume = options.volume || 1;

  isSpeaking = true;

  currentUtterance.onstart = () => {
    console.log('Voz iniciada');
  };

  currentUtterance.onend = () => {
    console.log('Voz terminada');
    isSpeaking = false;
    currentUtterance = null;
    if(onEnd) onEnd();
  };

  currentUtterance.onerror = (e) => {
    console.log('Error de voz:', e.error);
    isSpeaking = false;
    currentUtterance = null;
    if(onEnd) onEnd();
  };

  // Chrome bug fix: usar timeout y resume
  setTimeout(() => {
    if(!currentUtterance) return;
    speechSynth.speak(currentUtterance);
    // Chrome a veces se pausa solo, forzar resume
    if(speechSynth.paused){
      speechSynth.resume();
    }
  }, 100);

  // Chrome bug fix: mantener vivo el speech cada 10 segundos
  const keepAlive = setInterval(() => {
    if(!isSpeaking){
      clearInterval(keepAlive);
      return;
    }
    if(speechSynth.paused){
      speechSynth.resume();
    }
  }, 10000);
  } catch(e) {
    console.error('Error en speakText:', e);
    isSpeaking = false;
    if(onEnd) onEnd();
  }
}

// Detener lectura
function stopSpeaking(){
  if(speechSynth){
    speechSynth.cancel();
  }
  isSpeaking = false;
  currentUtterance = null;
}

// Leer el cuento completo (problema + pregunta)
function readStoryAloud(storyText, question, onComplete){
  // Construir texto completo
  const fullText = storyText + '. ' + question;

  // Indicador visual de lectura
  const storyEl = document.querySelector('.story-modal-text');
  const questionEl = document.querySelector('.story-modal-question');
  const voiceBtn = document.querySelector('.voice-btn');

  if(storyEl) storyEl.classList.add('reading');
  if(voiceBtn) voiceBtn.classList.add('speaking');

  speakText(fullText, () => {
    // Quitar indicadores visuales
    if(storyEl) storyEl.classList.remove('reading');
    if(questionEl) questionEl.classList.remove('reading');
    if(voiceBtn) voiceBtn.classList.remove('speaking');

    // Activar el quiz
    if(onComplete) onComplete();
  }, { rate: 0.88, pitch: 1.0 }); // Tono natural

  // Cambiar highlight de texto a pregunta a mitad de lectura (aproximado)
  const storyLength = storyText.length;
  const estimatedStoryTime = storyLength * 50; // ~50ms por carácter a velocidad 0.85

  setTimeout(() => {
    if(isSpeaking && storyEl && questionEl){
      storyEl.classList.remove('reading');
      questionEl.classList.add('reading');
    }
  }, estimatedStoryTime);
}

// Toggle manual de voz
function toggleVoiceReading(){
  if(isSpeaking){
    stopSpeaking();
    const voiceBtn = document.querySelector('.voice-btn');
    if(voiceBtn) voiceBtn.classList.remove('speaking');
    document.querySelectorAll('.reading').forEach(el => el.classList.remove('reading'));
  } else {
    // Re-leer el cuento actual
    const step = currentStory.steps[currentStep];
    const storyText = step.template
      .replaceAll('{char}', currentStory.character)
      .replaceAll('{a}', numA)
      .replaceAll('{b}', numB);

    readStoryAloud(storyText, step.question, () => {
      enableQuizSection();
    });
  }
}

// Habilitar sección del quiz
function enableQuizSection(){
  const quizSection = document.querySelector('.quiz-section');
  if(quizSection){
    quizSection.classList.remove('hidden');
  }
  // Pequeño sonido para indicar que puede responder
  sndClick();
}

function getTriviaCategories(){ return LANG === 'en' ? TRIVIA_CATEGORIES_EN : TRIVIA_CATEGORIES; }

let currentTriviaCategory = null;
let currentTriviaQuestion = null;
let triviaCallback = null;
let triviaQuestions = [];
let triviaCurrentIndex = 0;
let triviaCorrectCount = 0;
const TRIVIA_TOTAL_QUESTIONS = 3;

function showTriviaGame(onComplete){
  triviaCallback = onComplete;
  triviaQuestions = [];
  triviaCurrentIndex = 0;
  triviaCorrectCount = 0;

  // Seleccionar 3 preguntas de categorías aleatorias (pueden ser diferentes)
  const trivCats = getTriviaCategories();
  const categories = Object.keys(trivCats);
  for(let i = 0; i < TRIVIA_TOTAL_QUESTIONS; i++){
    const randomCat = categories[Math.floor(Math.random() * categories.length)];
    const cat = trivCats[randomCat];
    const q = cat.questions[Math.floor(Math.random() * cat.questions.length)];
    triviaQuestions.push({ ...q, category: cat });
  }

  // Mostrar primera pregunta
  showTriviaQuestion();
}

function showTriviaQuestion(){
  currentTriviaCategory = triviaQuestions[triviaCurrentIndex].category;
  currentTriviaQuestion = triviaQuestions[triviaCurrentIndex];

  const shuffledOptions = shuffleArray([...currentTriviaQuestion.options]);

  const optionsHTML = shuffledOptions.map(opt => `
    <button class="trivia-option" onclick="checkTriviaAnswer('${opt.replace(/'/g, "\\'")}')">${opt}</button>
  `).join('');

  // Progreso visual
  const progressDots = Array.from({length: TRIVIA_TOTAL_QUESTIONS}, (_, i) => {
    if(i < triviaCurrentIndex) return '<span class="trivia-dot done">✓</span>';
    if(i === triviaCurrentIndex) return '<span class="trivia-dot current">●</span>';
    return '<span class="trivia-dot">○</span>';
  }).join('');

  document.getElementById('triviaModal').style.display = 'flex';
  sndModalOpen();
  document.getElementById('triviaModal').innerHTML = `
    <div class="trivia-content">
      <div class="trivia-header">
        <div class="trivia-progress">${progressDots}</div>
        <div class="trivia-category">
          <span class="trivia-category-icon">${currentTriviaCategory.icon}</span>
          ${currentTriviaCategory.name}
        </div>
        <div class="trivia-title">🎁 ${L('Pregunta','Question')} ${triviaCurrentIndex + 1} ${L('de','of')} ${TRIVIA_TOTAL_QUESTIONS}</div>
        <div class="trivia-subtitle">⭐ ${triviaCorrectCount} ${L('estrellas ganadas','stars earned')}</div>
      </div>

      <div class="trivia-question-box">
        <div class="trivia-image">${currentTriviaQuestion.img}</div>
        <div class="trivia-question">${currentTriviaQuestion.q}</div>
      </div>

      <div class="trivia-options">${optionsHTML}</div>

      <div class="trivia-feedback" id="triviaFeedback"></div>
      <button class="trivia-continue-btn" id="triviaContinueBtn" onclick="nextTriviaQuestion()">${L('Siguiente','Next')} ➜</button>
    </div>
  `;

  // Deshabilitar botones mientras habla
  const allBtns = document.querySelectorAll('.trivia-option');
  allBtns.forEach(b => b.classList.add('disabled'));

  // Anunciar pregunta con iluminación de opciones
  const intro = triviaCurrentIndex === 0
    ? L(`¡${PLAYER.nickname}, tienes ${TRIVIA_TOTAL_QUESTIONS} preguntas premio! Primera pregunta, de ${currentTriviaCategory.name}.`,`${PLAYER.nickname}, you have ${TRIVIA_TOTAL_QUESTIONS} bonus questions! First question, from ${currentTriviaCategory.name}.`)
    : L(`Pregunta ${triviaCurrentIndex + 1}, de ${currentTriviaCategory.name}.`,`Question ${triviaCurrentIndex + 1}, from ${currentTriviaCategory.name}.`);

  // Leer intro y pregunta primero (con tiempo mínimo para evitar skip en móviles)
  const introText = `${intro} . . ${currentTriviaQuestion.q} . . ${L('Las opciones son:','The options are:')}`;
  const introMinTime = Math.max(2000, introText.length * 70);
  safeSpeakWithMinTime(introText, introMinTime, () => {
    // Ahora leer cada opción iluminándola
    readOptionsSequentially(shuffledOptions, 0, allBtns);
  }, { rate: 0.88, pitch: 1.0 });
}

function readOptionsSequentially(options, index, btns){
  if(index >= options.length){
    // Terminó de leer opciones, preguntar cuál es la respuesta
    btns.forEach(b => b.classList.remove('reading'));
    safeSpeakWithMinTime(L('¿Cuál es tu respuesta?','What is your answer?'), 800, () => {
      btns.forEach(b => b.classList.remove('disabled'));
    }, { rate: 0.88, pitch: 1.0 });
    return;
  }

  const letters = ['A', 'B', 'C', 'D'];
  const optionText = `${letters[index]}: ${options[index]}`;

  // Iluminar la opción actual
  btns.forEach(b => b.classList.remove('reading'));
  if(btns[index]) btns[index].classList.add('reading');

  // Tiempo mínimo estimado: ~80ms por carácter a rate 0.88
  const minTime = Math.max(800, optionText.length * 80);

  // Leer esta opción con tiempo mínimo para evitar que móviles la salten
  safeSpeakWithMinTime(optionText, minTime, () => {
    // Pequeña pausa y luego siguiente opción
    setTimeout(() => {
      readOptionsSequentially(options, index + 1, btns);
    }, 200);
  }, { rate: 0.88, pitch: 1.0 });
}

// Wrapper que garantiza un tiempo mínimo antes de llamar al callback
// Evita que en móviles el onend se dispare instantáneamente sin hablar
function safeSpeakWithMinTime(text, minMs, onEnd, options){
  const startTime = Date.now();
  let callbackFired = false;
  function safeCallback(){
    if(callbackFired) return;
    callbackFired = true;
    const elapsed = Date.now() - startTime;
    if(elapsed < minMs){
      setTimeout(() => { if(onEnd) onEnd(); }, minMs - elapsed);
    } else {
      if(onEnd) onEnd();
    }
  }
  speakText(text, safeCallback, options);
}

function checkTriviaAnswer(selected){
  const btns = document.querySelectorAll('.trivia-option');
  const feedback = document.getElementById('triviaFeedback');
  const correct = currentTriviaQuestion.a;

  btns.forEach(btn => {
    btn.classList.add('disabled');
    if(btn.textContent === correct) btn.classList.add('correct');
  });

  const selectedBtn = Array.from(btns).find(b => b.textContent === selected);

  if(selected === correct){
    sndCorrect();
    spawnConfetti(15);
    triviaCorrectCount++;
    score.stars++;
    renderScoreBar();

    feedback.className = 'trivia-feedback success show';
    feedback.innerHTML = `🎉 ${L('¡Correcto!','Correct!')} +1 ⭐`;

    const msgs = LANG === 'en' ? [`Good ${PLAYER.nickname}!`, `Correct!`, `That's it!`, `Great job!`] : [`¡Bien ${PLAYER.nickname}!`, `¡Correcto!`, `¡Eso es!`, `¡Muy bien!`];
    speakText(msgs[Math.floor(Math.random() * msgs.length)], () => {
      document.getElementById('triviaContinueBtn').classList.add('show');
    }, { rate: 0.88, pitch: 1.0 });

let desafioProblems = [];
let desafioCurrentIndex = 0;
let desafioCorrectCount = 0;
let desafioCombo = 0;
let desafioMaxCombo = 0;
let desafioStartTime = 0;
let desafioSpeedBonuses = 0;
let desafioCallback = null;
const DESAFIO_TOTAL = 20;

const desafioUsedKeys = new Set();
const desafioOpsPool = ['suma','suma','resta','resta','multi','multi','divi','suma','resta','multi'];
let desafioShuffledOps = [];

function generateDesafioProblems(){
  desafioProblems = [];
  desafioUsedKeys.clear();
  desafioShuffledOps = shuffleArray([...desafioOpsPool]);

  for(let i = 0; i < DESAFIO_TOTAL; i++){
    desafioProblems.push(generateOneDesafioProblem(i, 0));
  }
}

// nivel: 0=fácil, 1=medio, 2=difícil (se ajusta por racha)
function generateOneDesafioProblem(index, nivel){
  const op = desafioShuffledOps[index % desafioShuffledOps.length];
  let a, b, ans, sym, readText, key;
  let tries = 0;

  do {
    if(op === 'suma'){
      if(nivel === 0){       a = rand(1,9);   b = rand(1,9); }
      else if(nivel === 1){  a = rand(5,15);  b = rand(5,15); }
      else if(nivel === 2){  a = rand(10,30); b = rand(10,30); }
      else if(nivel === 3){  a = rand(20,50); b = rand(15,40); }
      else {                 a = rand(30,99); b = rand(20,70); }
      ans = a + b; sym = '+';
      readText = L(`${a} más ${b}`,`${a} plus ${b}`);
    } else if(op === 'resta'){
      if(nivel === 0){       a = rand(5,15);  b = rand(1, a - 1); }
      else if(nivel === 1){  a = rand(15,30); b = rand(5, a - 1); }
      else if(nivel === 2){  a = rand(25,50); b = rand(10, a - 1); }
      else if(nivel === 3){  a = rand(40,80); b = rand(15, a - 1); }
      else {                 a = rand(50,99); b = rand(20, a - 1); }
      ans = a - b; sym = '−';
      readText = L(`${a} menos ${b}`,`${a} minus ${b}`);
    } else if(op === 'multi'){
      if(nivel === 0){       a = rand(2,5);  b = rand(2,4); }
      else if(nivel === 1){  a = rand(3,7);  b = rand(3,6); }
      else if(nivel === 2){  a = rand(5,12); b = rand(4,9); }
      else if(nivel === 3){  a = rand(6,12); b = rand(6,12); }
      else {                 a = rand(7,15); b = rand(7,13); }
      ans = a * b; sym = '×';
      readText = L(`${a} por ${b}`,`${a} times ${b}`);
    } else {
      if(nivel === 0){       b = rand(2,4);  ans = rand(2,5); }
      else if(nivel === 1){  b = rand(3,6);  ans = rand(3,8); }
      else if(nivel === 2){  b = rand(4,9);  ans = rand(5,12); }
      else if(nivel === 3){  b = rand(5,12); ans = rand(6,15); }
      else {                 b = rand(6,15); ans = rand(7,18); }
      a = b * ans; sym = '÷';
      readText = L(`${a} entre ${b}`,`${a} divided by ${b}`);
    }
    key = `${a}${sym}${b}`;
    tries++;
  } while(desafioUsedKeys.has(key) && tries < 50);

  desafioUsedKeys.add(key);
  const distractors = generateDesafioDistractors(ans, nivel);
  const options = shuffleArray([ans, ...distractors]);

  return { op, a, b, answer: ans, sym, options, readText };
}

function getDesafioDifficulty(){
  // Escala progresiva: racha más larga = más difícil
  // También sube con el avance de preguntas
  const rachaBonus = desafioCombo >= 10 ? 4 : desafioCombo >= 7 ? 3 : desafioCombo >= 4 ? 2 : desafioCombo >= 2 ? 1 : 0;
  const progressBonus = desafioCurrentIndex >= 15 ? 2 : desafioCurrentIndex >= 10 ? 1 : 0;
  return Math.min(rachaBonus + progressBonus, 4);
}

function generateDesafioDistractors(correct, nivel){
  const set = new Set();
  // Distractores más engañosos en niveles altos
  const maxOffset = nivel >= 3 ? 8 : nivel >= 2 ? 5 : 3;
  while(set.size < 3){
    let offset = rand(1, maxOffset) * (Math.random() > 0.5 ? 1 : -1);
    let d = correct + offset;
    if(d < 0) d = correct + Math.abs(offset);
    if(d !== correct && !set.has(d)) set.add(d);
  }
  return [...set];
}

    }

    speakText(msgs[rand(0, msgs.length - 1)], () => {
      setTimeout(nextDesafioQuestion, 400);
    }, { rate: 1.1, pitch: 1.1 });

  } else {
    problem.wasCorrect = false;
    desafioCombo = 0;

    const selectedBtn = Array.from(btns).find(b => parseInt(b.textContent) === selected);
    if(selectedBtn) selectedBtn.classList.add('wrong');

    sndWrong();

    const rocket = document.querySelector('.desafio-rocket');

    speakText(L(`Era ${correct}`,`It was ${correct}`), () => {
      setTimeout(nextDesafioQuestion, 400);
    }, { rate: 1.0, pitch: 0.9 });
  }
}

// ========== MODULE RESULTS ==========

function generateModuleAnalysis(){
  const ops = ['suma', 'resta', 'multi', 'divi'];
  const opNames = LANG === 'en' ? { suma: 'Addition', resta: 'Subtraction', multi: 'Multiplication', divi: 'Division' } : { suma: 'Suma', resta: 'Resta', multi: 'Multiplicación', divi: 'División' };
  const opSymbols = { suma: '+', resta: '−', multi: '×', divi: '÷' };

  const analysis = { strong: [], needsPractice: [], weak: [] };

  ops.forEach(op => {
    const p = moduleTracker.performance[op];
    if(p.stepCount === 0) return;

    let opScore = 100;
    opScore -= Math.min(p.quizErrors * 15, 45);
    opScore -= Math.min(p.practiceErrors * 10, 30);
    const avgAttempts = p.dragAttempts / p.stepCount;
    if(avgAttempts > 1) opScore -= Math.min((avgAttempts - 1) * 12, 30);
    const avgHints = p.hintsUsed / p.stepCount;
    opScore -= Math.min(avgHints * 8, 24);
    opScore -= Math.min(p.termsErrors * 5, 20);
    const avgStars = p.starsEarned / p.stepCount;
    if(avgStars >= 2.5) opScore += 5;
    opScore = Math.max(0, Math.min(100, opScore));

    const entry = {
      op, name: opNames[op], sym: opSymbols[op], score: opScore,
      quizErrors: p.quizErrors, quizCorrect: p.quizCorrect,
      practiceErrors: p.practiceErrors,
      avgAttempts: avgAttempts.toFixed(1),
      avgHints: avgHints.toFixed(1),
      avgStars: avgStars.toFixed(1),
      termsErrors: p.termsErrors, termsCorrect: p.termsCorrect,
      stepCount: p.stepCount
    };

    if(opScore >= 75) analysis.strong.push(entry);
    else if(opScore >= 45) analysis.needsPractice.push(entry);
    else analysis.weak.push(entry);
  });

  return analysis;
}

function generateModuleSpeech(analysis, desafioPct, triviaPct, devMsg){
  if(LANG === 'en') return generateModuleSpeechEN(analysis, desafioPct, triviaPct, devMsg);
  let speech = '';

  // INTRO: saludo natural a los papás
  const intros = [
    `¡Hola papás! Vengan, les cuento. . ${PLAYER.name} acaba de terminar un módulo completo donde practicó las cuatro operaciones: suma, resta, multiplicación y división.`,
    `¡Buenas! Papás, les tengo noticias. . ${PLAYER.name} terminó su módulo de matemáticas y practicó suma, resta, multiplicación y división.`,
    `¡Hola! Qué bueno que están aquí. . Les voy a contar cómo le fue a ${PLAYER.name} en las cuatro operaciones que practicamos: suma, resta, multiplicación y división.`
  ];
  speech += intros[Math.floor(Math.random() * intros.length)] + ' . ';

  // LO QUE HIZO BIEN
  if(analysis.strong.length > 0){
    if(analysis.strong.length === 4){
      const perfectIntros = [
        `Y la verdad, ¡les fue increíble! ${PLAYER.name} dominó las cuatro operaciones sin ningún problema.`,
        `¡Y les cuento algo! ${PLAYER.name} estuvo excelente en TODO. . Las cuatro operaciones, perfecto.`,
        `La buena noticia es que ${PLAYER.name} mostró un nivel excelente en las cuatro operaciones.`
      ];
      speech += perfectIntros[Math.floor(Math.random() * perfectIntros.length)] + ' ';

      // Dar detalles de alguna operación destacada
      const best = analysis.strong.reduce((a, b) => parseFloat(a.avgStars) >= parseFloat(b.avgStars) ? a : b);
      if(best.quizErrors === 0 && best.termsErrors === 0){
        speech += `Por ejemplo, en la ${best.name} estuvo perfecto: identificó la operación siempre bien, resolvió los ejercicios y el vocabulario sin errores. `;
      }
    } else {
      const names = analysis.strong.map(e => e.name);
      if(names.length === 1){
        speech += `Empecemos por lo bueno: en la ${names[0]} le fue muy bien. `;
      } else if(names.length === 2){
        speech += `Empecemos por lo bueno: en ${names[0]} y ${names[1]} estuvo muy bien. `;
      } else {
        speech += `Empecemos por lo bueno: en ${names.slice(0, -1).join(', ')} y ${names[names.length-1]} le fue muy bien. `;
      }

      // Detalles de las fuertes (máximo 2 para no alargar)
      analysis.strong.slice(0, 2).forEach(e => {
        const details = [];
        if(e.quizErrors === 0) details.push('siempre supo identificarla en los cuentos');
        if(e.termsErrors === 0) details.push('se aprendió todo el vocabulario');
        if(parseFloat(e.avgStars) >= 2.5) details.push('sacó muchas estrellas');
        if(details.length > 0){
          speech += `En la ${e.name}, ${details.join(' y ')}. `;
        }
      });
    }
  }

  // LO QUE PUEDE MEJORAR
  if(analysis.needsPractice.length > 0){
    const transition = analysis.strong.length > 0
      ? `Ahora, hay algunas cositas que puede mejorar. `
      : `Bueno, hay áreas donde todavía puede crecer. `;
    speech += transition;

    analysis.needsPractice.forEach((e, i) => {
      const connector = i === 0 ? '' : 'También, ';
      speech += `${connector}en la ${e.name} `;

      const issues = [];
      if(e.quizErrors > 0 && e.practiceErrors > 0){
        issues.push(`a veces le costó reconocer cuándo un problema era de ${e.name.toLowerCase()}, por eso lo mandamos a practicar ${e.practiceErrors > 1 ? 'un par de veces' : 'una vez'}`);
      } else if(e.quizErrors > 0){
        issues.push(`le costó un poco identificar cuándo el cuento hablaba de ${e.name.toLowerCase()}`);
      }
      if(e.termsErrors > 0){
        issues.push(`hay que repasar los términos, como los nombres de los números en esa operación`);
      }
      if(parseFloat(e.avgHints) > 0.5){
        issues.push(`necesitó algunas pistas para resolver los ejercicios`);
      }

      if(issues.length > 0){
        speech += issues.join(', y ') + '. ';
      } else {
        speech += `puede practicar un poco más. `;
      }
    });

    speech += `Pero nada grave, con un poco más de práctica va a mejorar rápido. `;
  }

  // LO QUE NECESITA REFORZAR
  if(analysis.weak.length > 0){
    const weakTransition = analysis.needsPractice.length > 0
      ? `Y algo importante: `
      : (analysis.strong.length > 0 ? `Ahora, algo que sí necesita más trabajo: ` : `Les cuento algo: `);
    speech += weakTransition;

    const names = analysis.weak.map(e => e.name);
    speech += `la ${names.join(' y la ')} necesita más práctica. `;

    analysis.weak.forEach(e => {
      const issues = [];
      if(e.quizErrors > 0) issues.push(`todavía no reconoce bien cuándo un problema es de ${e.name.toLowerCase()}`);
      if(e.practiceErrors > 0) issues.push(`tuvo que ir a cuentos de práctica ${e.practiceErrors} ${e.practiceErrors > 1 ? 'veces' : 'vez'}`);
      if(parseFloat(e.avgAttempts) > 2) issues.push(`necesitó varios intentos para resolver los ejercicios`);
      if(e.termsErrors > 1) issues.push(`los términos de la ${e.name.toLowerCase()} hay que repasarlos en casa`);

      if(issues.length > 0){
        speech += `En la ${e.name}, ${issues.join(', y ')}. `;
      }
    });

    speech += `Pero tranquilos, es completamente normal. Vamos a seguir practicando y van a ver cómo va mejorando. `;
  }

  // CÁLCULO MENTAL Y TRIVIA (integrado naturalmente)
  if(desafioPct > 0 || triviaPct > 0){
    speech += '. Ah, y también les cuento sobre las actividades extras. ';
    if(desafioPct > 0){
      if(desafioPct >= 80) speech += `En el cálculo mental rápido estuvo increíble, sacó ${desafioPct} por ciento de aciertos. `;
      else if(desafioPct >= 60) speech += `En el cálculo mental rápido le fue bien, sacó ${desafioPct} por ciento. `;
      else speech += `En el cálculo mental rápido sacó ${desafioPct} por ciento, ahí puede mejorar la velocidad. `;
    }
    if(triviaPct > 0){
      if(triviaPct >= 80) speech += `Y en la trivia de cultura general estuvo genial con ${triviaPct} por ciento de aciertos. `;
      else if(triviaPct >= 50) speech += `En la trivia de cultura general sacó ${triviaPct} por ciento, nada mal. `;
      else speech += `La trivia estuvo difícil, sacó ${triviaPct} por ciento, pero así va aprendiendo cosas nuevas. `;
    }
  }

  // CIERRE
  const allStrong = analysis.weak.length === 0 && analysis.needsPractice.length === 0;
  if(allStrong){
    const closes = [
      `. En resumen, ¡${PLAYER.fullName} es un campeón de las matemáticas! Felicítenlo mucho porque se lo merece.`,
      `. Para cerrar, ¡${PLAYER.fullName} domina las cuatro operaciones! Estoy muy orgulloso de cómo trabajó hoy.`,
      `. En conclusión, ¡excelente trabajo de ${PLAYER.fullName}! Todas las operaciones las maneja muy bien.`
    ];
    speech += closes[Math.floor(Math.random() * closes.length)] + ' ';
  } else {
    const closes = [
      `. En general, ${PLAYER.name} está aprendiendo muy bien. Lo importante es que siga practicando y divirtiéndose con las matemáticas.`,
      `. En resumen, ${PLAYER.name} va por buen camino. Con práctica constante va a dominar todo. ¡Ánimo!`,
      `. Para cerrar, ${PLAYER.name} está progresando. Les recomiendo practicar juntos un ratito en casa, sobre todo las operaciones que le costaron más.`
    ];
    speech += closes[Math.floor(Math.random() * closes.length)] + ' ';
  }

  // MENSAJE DEL DESARROLLADOR (transición natural)
  speech += `. . Ah, y una última cosa: . ${devMsg} . `;

  // PREGUNTA FINAL
  speech += `. . Bueno ${PLAYER.name}, ¿quieres empezar un nuevo módulo?`;
  return speech;
}

function generateModuleSpeechEN(analysis, desafioPct, triviaPct, devMsg){
  const opNamesEN = { suma: 'Addition', resta: 'Subtraction', multi: 'Multiplication', divi: 'Division' };
  let speech = `Hello parents! Let me tell you how ${PLAYER.name} did. . ${PLAYER.name} just completed a full module practicing all four operations: addition, subtraction, multiplication and division. . `;

  if(analysis.strong.length === 4){
    speech += `And the truth is, it was amazing! ${PLAYER.name} mastered all four operations without any problems. `;
  } else if(analysis.strong.length > 0){
    const names = analysis.strong.map(e => opNamesEN[e.op]);
    speech += `Let's start with the good news: ${PLAYER.name} did great in ${names.join(' and ')}. `;
  }

  if(analysis.needsPractice.length > 0){
    const names = analysis.needsPractice.map(e => opNamesEN[e.op]);
    speech += `There are some areas to improve: ${names.join(' and ')} could use a bit more practice. `;
  }

  if(analysis.weak.length > 0){
    const names = analysis.weak.map(e => opNamesEN[e.op]);
    speech += `And ${names.join(' and ')} needs more work. But don't worry, it's completely normal. With more practice, improvement will come quickly. `;
  }

  if(desafioPct > 0){
    speech += `In the mental math challenge, ${PLAYER.name} got ${desafioPct} percent correct. `;
  }
  if(triviaPct > 0){
    speech += `In the culture trivia, ${PLAYER.name} got ${triviaPct} percent correct. `;
  }

  const allStrong = analysis.weak.length === 0 && analysis.needsPractice.length === 0;
  if(allStrong){
    speech += `. In summary, ${PLAYER.fullName} is a math champion! Give lots of congratulations, it's well deserved. `;
  } else {
    speech += `. Overall, ${PLAYER.name} is learning very well. The important thing is to keep practicing and having fun with math. `;
  }

  speech += `. . Oh, and one last thing: . ${devMsg} . `;
  speech += `. . So ${PLAYER.name}, do you want to start a new module?`;
  return speech;
}

function showModuleReport(){
  stopSpeaking();
  const analysis = generateModuleAnalysis();

  spawnConfetti(100);
  spawnStars(12);

  // Helper para generar barra de progreso
  function statBar(label, value, max, color){
    const pct = max > 0 ? Math.round((value / max) * 100) : 0;
    return `<div class="module-stat-row">
      <span class="module-stat-label">${label}</span>
      <div class="module-stat-bar-bg"><div class="module-stat-bar ${color}" style="width:${pct}%"></div></div>
      <span class="module-stat-value">${value}/${max}</span>
    </div>`;
  }

  // Helper para score badge
  function scoreBadge(score){
    if(score >= 75) return `<span class="module-op-score high">${score}%</span>`;
    if(score >= 45) return `<span class="module-op-score mid">${score}%</span>`;
    return `<span class="module-op-score low">${score}%</span>`;
  }

  // Generar HTML detallado por cada operación
  const ops = ['suma', 'resta', 'multi', 'divi'];
  const opNames = LANG === 'en' ? { suma: 'Addition', resta: 'Subtraction', multi: 'Multiplication', divi: 'Division' } : { suma: 'Suma', resta: 'Resta', multi: 'Multiplicación', divi: 'División' };
  const opSymbols = { suma: '+', resta: '−', multi: '×', divi: '÷' };

  let opsHTML = '';
  ops.forEach(op => {
    const p = moduleTracker.performance[op];
    if(p.stepCount === 0) return;

    const entry = [...analysis.strong, ...analysis.needsPractice, ...analysis.weak].find(e => e.op === op);
    if(!entry) return;

    const scoreColor = entry.score >= 75 ? 'strong' : entry.score >= 45 ? 'practice' : 'weak';
    const totalQuiz = p.quizCorrect + p.quizErrors;
    const totalTerms = p.termsCorrect + p.termsErrors;
    const quizColor = p.quizErrors === 0 ? 'green' : p.quizErrors <= 1 ? 'yellow' : 'red';
    const termsColor = p.termsErrors === 0 ? 'green' : p.termsErrors <= 1 ? 'yellow' : 'red';
    const starsColor = parseFloat(entry.avgStars) >= 2.5 ? 'green' : parseFloat(entry.avgStars) >= 1.5 ? 'yellow' : 'red';

    opsHTML += `
      <div class="module-op-card ${scoreColor}" style="margin-bottom:12px">
        <div class="module-op-header">
          <div class="module-op-name" style="font-size:.95rem">${opSymbols[op]} ${opNames[op]}</div>
          ${scoreBadge(entry.score)}
        </div>
        ${statBar(L('Identificar operación','Identify operation'), p.quizCorrect, totalQuiz, quizColor)}
        ${statBar(L('Estrellas','Stars'), p.starsEarned, p.stepCount * 3, starsColor)}
        ${statBar(L('Vocabulario','Vocabulary'), p.termsCorrect, totalTerms, termsColor)}
        <div class="module-stat-row">
          <span class="module-stat-label">${L('Intentos promedio','Average attempts')}</span>
          <div class="module-stat-bar-bg"><div class="module-stat-bar ${parseFloat(entry.avgAttempts) <= 1 ? 'green' : parseFloat(entry.avgAttempts) <= 2 ? 'yellow' : 'red'}" style="width:${Math.min(100, (1 / parseFloat(entry.avgAttempts)) * 100)}%"></div></div>
          <span class="module-stat-value">${entry.avgAttempts}</span>
        </div>
        ${p.practiceErrors > 0 ? `<div style="font-size:.7rem;color:var(--yellow);margin-top:4px">⚠️ ${L(`Fue a cuento de práctica ${p.practiceErrors} ${p.practiceErrors > 1 ? 'veces' : 'vez'}`,`Went to practice story ${p.practiceErrors} ${p.practiceErrors > 1 ? 'times' : 'time'}`)}</div>` : ''}
        ${parseFloat(entry.avgHints) > 0 ? `<div style="font-size:.7rem;color:var(--cyan);margin-top:2px">💡 ${L(`Usó pistas: ${entry.avgHints} promedio`,`Used hints: ${entry.avgHints} average`)}</div>` : ''}
      </div>`;
  });

  const desafioPct = moduleTracker.totalDesafioTotal > 0
    ? Math.round((moduleTracker.totalDesafioCorrect / moduleTracker.totalDesafioTotal) * 100) : 0;
  const triviaPct = moduleTracker.totalTriviaTotal > 0
    ? Math.round((moduleTracker.totalTriviaCorrect / moduleTracker.totalTriviaTotal) * 100) : 0;

  const allStrong = analysis.weak.length === 0 && analysis.needsPractice.length === 0;

    overallEmoji = '🏆';

    const weakNames = analysis.weak.map(e => e.name).join(L(' y ',' and '));
    overallMsg = L(`💪 Hay que reforzar la ${weakNames} en casa.`,`💪 Need to practice ${weakNames} at home.`);

  }

  const devMessages = LANG === 'en' ? [

      <!-- Score global -->
      <div style="background:rgba(167,139,250,.1);border-radius:14px;padding:14px;margin-bottom:16px;border:1px solid rgba(167,139,250,.2)">
        <div style="display:flex;align-items:center;justify-content:space-around;gap:8px;text-align:center">

        </div>
        ${statBar('', moduleTracker.totalDesafioCorrect, moduleTracker.totalDesafioTotal, desafioPct >= 70 ? 'green' : desafioPct >= 50 ? 'yellow' : 'red')}
        <div class="module-big-stat" style="margin-top:6px">
          <div class="module-big-stat-icon">🎯</div>
          <div class="module-big-stat-info">

        </div>
        ${statBar('', moduleTracker.totalTriviaCorrect, moduleTracker.totalTriviaTotal, triviaPct >= 70 ? 'green' : triviaPct >= 50 ? 'yellow' : 'red')}
      </div>

      <div class="module-overall">${overallMsg}</div>

      <div style="margin-top:12px;font-size:.85rem;color:var(--pink);font-weight:700;font-style:italic">${devMsg}</div>

      <button class="module-btn" id="moduleCloseBtn" onclick="closeModuleResults()" style="pointer-events:none;opacity:.5">
        🎲 ${L('¿Quieres empezar un nuevo módulo?','Want to start a new module?')}
      </button>
    </div>
  `;

    const btn = document.getElementById('moduleCloseBtn');
    if(btn){ btn.style.pointerEvents = 'auto'; btn.style.opacity = '1'; }
  }, { rate: 0.85, pitch: 1.0 });
}

        Object.assign(moduleTracker.performance[op], {
          stepCount:2, quizCorrect:2, quizErrors:0, dragAttempts:3, hintsUsed:0,
          starsEarned:5, termsCorrect:1, termsErrors:3, practiceErrors:0
        });
      });
      moduleTracker.totalDesafioCorrect = 15; moduleTracker.totalDesafioTotal = 20;
      moduleTracker.totalTriviaCorrect = 3; moduleTracker.totalTriviaTotal = 6;
      moduleTracker.adventuresInModule = 2;
    }
  }
];
document.addEventListener('keydown', (e) => {
  if(e.ctrlKey && e.shiftKey && e.key === 'M'){
    const scenario = DEBUG_SCENARIOS[debugScenario % DEBUG_SCENARIOS.length];
    console.log(`%c[DEBUG] Escenario ${debugScenario + 1}/${DEBUG_SCENARIOS.length}: ${scenario.name}`, 'color:magenta;font-weight:bold');
    scenario.setup();
    showModuleResults();
    debugScenario++;
  }
});

// ========== RIPPLE EFFECT & BUTTON SOUNDS ==========
document.addEventListener('click', function(e){
  // Ripple effect para botones interactivos
  const rippleTargets = '.btn, .op-btn, .trivia-option, .desafio-option, .term-option, .listen-btn, .continue-btn, .trivia-continue-btn, .module-btn, .desafio-continue-btn';
  const target = e.target.closest(rippleTargets);
  if(target){
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    const rect = target.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
    target.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  }
});

// Sonido sutil de hover en botones principales (solo desktop)
if(window.matchMedia('(hover:hover)').matches){
  let lastHoverSound = 0;
  document.addEventListener('mouseover', function(e){
    const now = Date.now();
    if(now - lastHoverSound < 150) return; // Throttle
    const hoverTargets = '.btn-check, .btn-new, .op-btn, .trivia-option, .desafio-option, .listen-btn';
    if(e.target.closest(hoverTargets)){
      lastHoverSound = now;
      sndHover();
    }
  });
}

// ========== START ==========
init();
</script>
